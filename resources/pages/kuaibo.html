<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>KuaiBo</title>

<link href="theme.css" rel="stylesheet"/>

<body data-reference-template="kuaibo">
<nav class="top-nav">

    <img alt="KuaiBo" class="brand-logo" data-hub-logo src="https://alphapundits.com/landing-static/70/70/index_files/logo.png"/>

  </div>

<main class="main-showcase">
  <div class="language-switcher" role="group" aria-label="Language">
    <button class="lang-btn active" data-lang="en" type="button">EN</button>
    <button class="lang-btn" data-lang="id" type="button">ID</button>

  <a class="action-button download-link" href="#download" id="downloadTrigger" role="button">
    <i class="fab fa-android" aria-hidden="true"></i>
    <span data-kb="download-button">Download Android Version</span>
  </a>
</main>

<footer class="site-footer">
  <p><span data-kb="footer-copyright">© 2026 KuaiBo | Official Download Channel</span></p>
  <p class="footer-tagline">
    <i class="fab fa-android" aria-hidden="true"></i>
    <span data-kb="footer-tagline">Safe Ad-Free Experience</span>
  </p>
</footer>

<dialog id="hub-ref-dialog">
  <button aria-label="Close" data-ref-action="close" type="button">×</button>
  <img alt="" data-hub-logo height="64" src="https://alphapundits.com/landing-static/70/70/index_files/logo.png" width="64"/>
  <h2 data-hub-name>KuaiBo</h2>
  <p data-ref-dialog-description>Open the app link to continue.</p>
  <a class="download-link" data-ref-modal-download href="#download" role="link">Download</a>
